name: shopee-managed

x-service: &service
  build:
    context: .
    dockerfile: deploy/Dockerfile
  image: shopee-managed-service:local
  user: "${SH_RUN_UID:?Run deploy/bootstrap.py first}:${SH_RUN_GID:?Run deploy/bootstrap.py first}"
  restart: unless-stopped
  stop_grace_period: 60s
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  environment:
    SH_DATABASE_URL_FILE: /run/secrets/database_url
    SH_API_TOKEN_FILE: /run/secrets/api_token
    SH_SECRET_KEY_FILE: /run/secrets/encryption_key
    SH_DISCORD_WEBHOOK_FILE: /run/secrets/discord_webhook
    SH_MIN_INTERVAL_SECONDS: "${SH_MIN_INTERVAL_SECONDS:-6}"
    SH_LEASE_SECONDS: "90"
    SH_API_RATE_LIMIT: "${SH_API_RATE_LIMIT:-600}"
  secrets: [database_url, api_token, encryption_key, discord_webhook]
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopee
      POSTGRES_USER: shopee
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets: [database_password]
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U shopee -d shopee"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    <<: *service
    ports: ["127.0.0.1:${SH_LOCAL_PORT:-8000}:8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    <<: *service
    command: [python, -m, shopee_service.worker]

volumes:
  database:

secrets:
  database_password:
    file: ./.secrets/database_password
  database_url:
    file: ./.secrets/database_url
  api_token:
    file: ./.secrets/api_token
  encryption_key:
    file: ./.secrets/encryption_key
  discord_webhook:
    file: ./.secrets/discord_webhook
